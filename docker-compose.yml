services:
  # 1. PostgreSQL Relational Metadata Store
  db:
    image: postgres:16-alpine
    container_name: codebase-rag-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: codebase_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: codebase-rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # 3. FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: codebase-rag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/codebase_rag
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=tinyllama
      - EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2
      - EMBEDDING_MODEL_LOCAL_ONLY=false
      - CORS_ALLOW_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:80,http://127.0.0.1:80,http://localhost
    volumes:
      - ./data:/app/data
      - ./merged model:/app/merged model
    depends_on:
      - db
      - ollama

  # 4. React Frontend UI
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: codebase-rag-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
